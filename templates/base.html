{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CyberPedia{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --cp-bg: #0d1117;
      --cp-surface: #161b22;
      --cp-border: #30363d;
      --cp-text: #e6edf3;
      --cp-muted: #8b949e;
      --cp-red: #f85149;
      --cp-blue: #58a6ff;
      --cp-green: #3fb950;
      --cp-yellow: #d29922;
    }
    body { background: var(--cp-bg); color: var(--cp-text); font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: var(--cp-surface) !important; border-bottom: 1px solid var(--cp-border); }
    .navbar-brand { color: var(--cp-red) !important; font-weight: 700; font-size: 1.4rem; }
    .nav-link { color: var(--cp-text) !important; }
    .nav-link:hover { color: var(--cp-blue) !important; }
    .card { background: var(--cp-surface); border: 1px solid var(--cp-border); }
    .card-header { background: rgba(255,255,255,.03); border-bottom: 1px solid var(--cp-border); }
    .badge-bassa { background: var(--cp-green); }
    .badge-media { background: var(--cp-yellow); }
    .badge-alta { background: #e3702b; }
    .badge-critica { background: var(--cp-red); }
    .btn-cp-primary { background: var(--cp-red); border-color: var(--cp-red); color: #fff; }
    .btn-cp-primary:hover { background: #da3d35; border-color: #da3d35; color: #fff; }
    .btn-cp-outline { border-color: var(--cp-blue); color: var(--cp-blue); }
    .btn-cp-outline:hover { background: var(--cp-blue); color: #000; }
    .form-control, .form-select { background: var(--cp-bg); border-color: var(--cp-border); color: var(--cp-text); }
    .form-control:focus, .form-select:focus { background: var(--cp-bg); border-color: var(--cp-blue); color: var(--cp-text); box-shadow: 0 0 0 .2rem rgba(88,166,255,.2); }
    .table { --bs-table-bg: var(--cp-surface); --bs-table-border-color: var(--cp-border); color: var(--cp-text); }
    footer { background: var(--cp-surface); border-top: 1px solid var(--cp-border); }
    .text-muted { color: var(--cp-muted) !important; }
    a { color: var(--cp-blue); }
    a:hover { color: #79b8ff; }
    .famiglia-badge { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

{% include 'partials/navbar.html' %}

<main class="container py-4">
  {% for msg in messages %}
    <div class="alert alert-{% if msg.tags == 'error' %}danger{% elif msg.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show" role="alert">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}

  {% block content %}{% endblock %}
</main>

{% include 'partials/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
